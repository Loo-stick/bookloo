<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Book Loo Store</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body data-page="connexion">
  <main class="connexion">
    <a class="marque" href="/accueil.html">Book Loo<span> Store</span></a>
    <h1>Connexion</h1>
    <form id="form">
      <label for="login">Identifiant</label>
      <input type="text" id="login" autocomplete="username" required>
      <label for="motdepasse">Mot de passe</label>
      <input type="password" id="motdepasse" autocomplete="current-password" required>
      <button type="submit" class="principal">Entrer</button>
    </form>
    <div id="sortie"></div>
  </main>
  <script src="/actions-release.js"></script>
  <script src="/vignette.js"></script>
  <script src="/app.js"></script>
</body>
</html>
