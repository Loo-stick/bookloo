# EXEMPLE de vhost Apache pour Book Loo Store.
#
# `example.com` est le domaine reserve a la documentation : remplacez-le par le votre.
# Ce fichier est un MODELE — il ne decrit aucune instance en particulier.
#
# Vhost Apache pour Book Loo Store.
#
# PORT 80 UNIQUEMENT, et ce n'est pas un detail : le *:443 par defaut appartient a
# projet-instit, qui capture tout. Un vhost pose sur 443 renverrait sa page de connexion
# au lieu de Book Loo Store.
#
# Chemin public : navigateur -> Cloudflare -> tunnel cloudflared (catch-all)
#                 -> Apache :80 (route par ServerName) -> conteneur 127.0.0.1:8480
#
# PAS D'EN-TETES CORS ICI, contrairement au vhost de Dramallyu. Celui-ci est un addon
# appele depuis une origine web, il en a besoin. Book Loo Store est une application a cookies :
# ouvrir CORS n'apporterait rien et affaiblirait la protection anti-CSRF.
#
# Installation :
#   sudo cp deploy/apache-vhost.example.conf /etc/apache2/sites-available/
#   sudo a2ensite bookloo.example.com.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName bookloo.example.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8480/
    ProxyPassReverse / http://127.0.0.1:8480/

    # Sans cet en-tete, Express croit la requete en clair : les cookies Secure sont
    # poses mais le navigateur ne les renverra jamais, et la connexion echoue sans
    # message. cloudflared le pose deja ; on le REAFFIRME pour ne pas dependre de lui.
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/bookloo_error.log
    CustomLog ${APACHE_LOG_DIR}/bookloo_access.log combined
</VirtualHost>
